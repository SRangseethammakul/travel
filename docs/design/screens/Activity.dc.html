<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ความเคลื่อนไหว</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A6A}a:hover{color:#075E52}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #0B7A6A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F5F7; color: #13222F; font-family: 'IBM Plex Sans Thai', sans-serif; overflow: hidden; position: relative">

  <header style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 10px">
    <div style="display: flex; align-items: center; gap: 8px; margin-left: -8px">
      <a href="Main.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #13222F">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div style="flex: 1; display: flex; flex-direction: column">
        <h1 style="margin: 0; font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">ความเคลื่อนไหว</h1>
        <span style="font-size: 12px; color: #5B6B78">โตเกียวหน้าหนาว · ยังไม่อ่าน {{unread}}</span>
      </div>
      <button type="button" aria-label="ตั้งค่าการแจ้งเตือน" onClick="{{openSettings}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #E3E8EC; border-radius: 14px; background: #FFFFFF; color: #13222F; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="flex-shrink: 0; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: flex-end; margin-bottom: -8px">
      <button type="button" onClick="{{markAll}}" style="min-height: 36px; padding: 0 4px; border: 0; background: none; color: #0B7A6A; font-size: 13px; font-weight: 600; cursor: pointer">อ่านทั้งหมดแล้ว</button>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #5B6B78">{{g.title}}</h2>
        <div style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 18px; overflow: hidden">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <a href="{{it.href}}" onClick="{{it.read}}" style="display: flex; gap: 12px; padding: 14px; border-bottom: 1px solid #EEF1F4; background: {{it.bg}}; color: #13222F; text-decoration: none">
              <span style="position: relative; width: 40px; height: 40px; flex-shrink: 0">
                <span style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{it.color}}; color: #FFFFFF; font-family: Prompt, sans-serif; font-weight: 600; font-size: 15px">{{it.i}}</span>
                <span style="position: absolute; right: -4px; bottom: -4px; padding: 1px 5px; border-radius: 999px; border: 2px solid #FFFFFF; background: {{it.tagBg}}; color: {{it.tagFg}}; font-size: 10px; font-weight: 700">{{it.tag}}</span>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 14px; line-height: 1.5"><strong style="font-weight: 600">{{it.who}}</strong> {{it.text}}</span>
                <span style="font-size: 12px; color: #5B6B78">{{it.time}}</span>
                <sc-if value="{{it.hasAction}}" hint-placeholder-val="{{ false }}">
                  <span style="align-self: flex-start; display: flex; align-items: center; min-height: 32px; margin-top: 2px; padding: 0 12px; border-radius: 10px; background: #0B7A6A; color: #FFFFFF; font-size: 13px; font-weight: 600">{{it.action}}</span>
                </sc-if>
              </span>
              <sc-if value="{{it.unread}}" hint-placeholder-val="{{ false }}">
                <span role="img" aria-label="ยังไม่อ่าน" style="width: 10px; height: 10px; flex-shrink: 0; margin-top: 6px; border-radius: 50%; background: #0B7A6A"></span>
              </sc-if>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>

  <sc-if value="{{settings}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(19, 34, 47, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
      <section role="dialog" aria-labelledby="notiTitle" style="display: flex; flex-direction: column; gap: 4px; padding: 22px 20px 32px; background: #FFFFFF; border-radius: 24px 24px 0 0">
        <h2 id="notiTitle" style="margin: 0; font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">แจ้งเตือนฉันเมื่อ</h2>
        <p style="margin: 0 0 8px; font-size: 12px; color: #5B6B78">ทุกรายการยังดูได้ในหน้านี้ ตั้งค่านี้มีผลแค่การแจ้งเตือนบนมือถือ</p>
        <sc-for list="{{prefs}}" as="p" hint-placeholder-count="5">
          <button type="button" role="switch" aria-checked="{{p.on}}" onClick="{{p.toggle}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0; border: 0; border-bottom: 1px solid #EEF1F4; background: none; color: #13222F; text-align: left; cursor: pointer">
            <span style="font-size: 15px; font-weight: 500">{{p.label}}</span>
            <span style="width: 44px; height: 26px; flex-shrink: 0; border-radius: 999px; padding: 3px; box-sizing: border-box; display: flex; justify-content: {{p.justify}}; background: {{p.bg}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(19, 34, 47, 0.25)"></span></span>
          </button>
        </sc-for>
        <button type="button" onClick="{{closeSettings}}" style="min-height: 48px; margin-top: 12px; border: 0; border-radius: 14px; background: #13222F; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">เสร็จ</button>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      filter: 'all', read: {}, settings: false,
      prefs: { mine: true, pay: true, plan: false, member: true, remind: true }
    };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var TAG = {
      expense: { label: '฿', bg: '#FCEBDD', fg: '#8A4A0C' },
      pay: { label: 'โอน', bg: '#E3F2EF', fg: '#0B5C50' },
      plan: { label: 'แผน', bg: '#E6EDFA', fg: '#23468F' },
      member: { label: 'ใหม่', bg: '#F1E6F5', fg: '#6E2F82' }
    };
    var P = { Mint: ['M', '#2F5BB7'], Beam: ['B', '#B2540F'] };
    var feed = [
      { id: 1, day: 'วันนี้', type: 'pay', who: 'Beam', text: 'แจ้งโอนเงินให้คุณ ฿5,800 พร้อมแนบสลิป', time: '21:58', unread: true, action: 'ตรวจและยืนยัน', href: 'SettleUp.dc.html' },
      { id: 2, day: 'วันนี้', type: 'expense', who: 'Mint', text: 'เพิ่มค่าใช้จ่าย "ชาบูบุฟเฟ่ต์" ฿3,300 · ส่วนของคุณ ฿1,100', time: '20:40', unread: true, href: 'ExpenseDetail.dc.html' },
      { id: 3, day: 'วันนี้', type: 'plan', who: 'Mint', text: 'ย้าย "Tokyo Skytree" เป็น 11:30 ในวันที่ 2', time: '18:12', unread: true, href: 'Planner.dc.html' },
      { id: 4, day: 'เมื่อวาน', type: 'member', who: 'Beam', text: 'เข้าร่วมทริปผ่าน LINE', time: '22:05', unread: false, href: 'Members.dc.html' },
      { id: 5, day: 'เมื่อวาน', type: 'pay', who: 'Mint', text: 'โอนคืนให้คุณ ฿3,100 · คุณยืนยันแล้ว', time: '21:30', unread: false, href: 'Summary.dc.html' },
      { id: 6, day: 'เมื่อวาน', type: 'plan', who: 'Mint', text: 'เพิ่มสถานที่ "คาเฟ่ใต้ทางรถไฟ" ใน Akihabara', time: '15:10', unread: false, href: 'Places.dc.html' }
    ];
    var isUnread = function (f) { return f.unread && !st.read[f.id]; };
    var filterDefs = [['all', 'ทั้งหมด'], ['expense', 'ค่าใช้จ่าย'], ['pay', 'การโอน'], ['plan', 'แผนและสถานที่'], ['member', 'สมาชิก']];
    var filters = filterDefs.map(function (f) {
      var on = st.filter === f[0];
      return { label: f[1], on: on ? 'true' : 'false', border: on ? '#13222F' : '#D5DDE3', bg: on ? '#13222F' : '#FFFFFF', fg: on ? '#FFFFFF' : '#13222F', pick: function () { self.setState({ filter: f[0] }); } };
    });
    var shown = feed.filter(function (f) { return st.filter === 'all' || f.type === st.filter; });
    var order = [], map = {};
    shown.forEach(function (f) {
      if (!map[f.day]) { map[f.day] = []; order.push(f.day); }
      var t = TAG[f.type];
      var u = isUnread(f);
      map[f.day].push({
        who: f.who, text: f.text, time: f.time, href: f.href, i: P[f.who][0], color: P[f.who][1],
        tag: t.label, tagBg: t.bg, tagFg: t.fg, unread: u, bg: u ? '#F4FAF8' : '#FFFFFF',
        hasAction: !!f.action && u, action: f.action || '',
        read: function () { var r = Object.assign({}, st.read); r[f.id] = true; self.setState({ read: r }); }
      });
    });
    var groups = order.map(function (d) { return { title: d, items: map[d] }; });
    var prefDefs = [['mine', 'มีค่าใช้จ่ายที่ฉันต้องจ่ายด้วย'], ['pay', 'มีคนโอนเงินหรือแจ้งโอนถึงฉัน'], ['plan', 'แผนหรือสถานที่เปลี่ยน'], ['member', 'มีคนเข้าร่วมหรือขอเข้าร่วม'], ['remind', 'เตือนก่อนวันเดินทาง 1 วัน']];
    var prefs = prefDefs.map(function (p) {
      var on = !!st.prefs[p[0]];
      return { label: p[1], on: on ? 'true' : 'false', bg: on ? '#0B7A6A' : '#C9D3DA', justify: on ? 'flex-end' : 'flex-start', toggle: function () { var x = Object.assign({}, st.prefs); x[p[0]] = !x[p[0]]; self.setState({ prefs: x }); } };
    });
    return {
      filters: filters, groups: groups, prefs: prefs, settings: st.settings,
      unread: feed.filter(isUnread).length,
      markAll: function () { var r = {}; feed.forEach(function (f) { r[f.id] = true; }); self.setState({ read: r }); },
      openSettings: function () { self.setState({ settings: true }); },
      closeSettings: function () { self.setState({ settings: false }); }
    };
  }
}
</script>
</body>
</html>
