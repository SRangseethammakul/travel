<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ทริปของฉัน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A6A}a:hover{color:#075E52}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F5F7; color: #13222F; font-family: 'IBM Plex Sans Thai', sans-serif; overflow: hidden; position: relative">

  <header style="display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 13px; color: #5B6B78">สวัสดี Act</span>
        <h1 style="margin: 0; font-family: Prompt, sans-serif; font-size: 26px; font-weight: 600">ทริปของฉัน</h1>
      </div>
      <button type="button" aria-label="บัญชีของฉัน" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #0B7A6A; color: #FFFFFF; font-family: Prompt, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">A</button>
    </div>
    <div role="tablist" aria-label="สถานะทริป" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E3E8EC; border-radius: 14px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="min-height: 40px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.shadow}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 110px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{trips}}" as="t" hint-placeholder-count="2">
      <a href="Main.dc.html" style="display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; background: #FFFFFF; color: #13222F; text-decoration: none">
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; background: {{t.cover}}; color: #FFFFFF">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-size: 13px; opacity: 0.85">{{t.dest}}</span>
            <span style="padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: #13222F; font-size: 12px; font-weight: 600">{{t.badge}}</span>
          </div>
          <span style="font-family: Prompt, sans-serif; font-size: 20px; font-weight: 600">{{t.name}}</span>
          <span style="font-size: 13px; opacity: 0.9">{{t.dates}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
          <span style="display: flex">
            <sc-for list="{{t.people}}" as="p" hint-placeholder-count="3">
              <span style="width: 28px; height: 28px; margin-right: -6px; border-radius: 50%; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; background: {{p.color}}; color: #FFFFFF; font-family: Prompt, sans-serif; font-size: 11px; font-weight: 600">{{p.i}}</span>
            </sc-for>
          </span>
          <span style="flex: 1; font-size: 13px; color: #5B6B78; padding-left: 6px">{{t.meta}}</span>
          <span style="font-size: 13px; font-weight: 600; color: {{t.balColor}}">{{t.balance}}</span>
        </div>
      </a>
    </sc-for>

    <a href="JoinTrip.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1.5px dashed #C9D3DA; border-radius: 16px; color: #13222F; font-size: 14px; font-weight: 500; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
      มีลิงก์เชิญ? เข้าร่วมทริปของเพื่อน
    </a>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #F3F5F7">
    <a href="CreateTrip.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; background: #0B7A6A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>สร้างทริปใหม่
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'up' };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var P = { A: '#0B7A6A', M: '#2F5BB7', B: '#B2540F', P: '#8A3FA0', N: '#3C4C59', K: '#5B6B78' };
    var mk = function (s) { return s.split('').map(function (c) { return { i: c, color: P[c] }; }); };
    var data = {
      up: [
        { name: 'โตเกียวหน้าหนาว', dest: 'โตเกียว · ญี่ปุ่น', dates: 'ส. 12 – อ. 15 ธ.ค. 2569', badge: 'อีก 34 วัน', cover: '#13222F', people: mk('AMBP'), meta: '4 คน · ใช้ไป ฿30,350', balance: '+฿14,050', balColor: '#0B7A6A' },
        { name: 'ญี่ปุ่นฤดูใบไม้ผลิ', dest: 'Tokyo · Kyoto · Osaka', dates: 'ส. 20 – อา. 28 มี.ค. 2570', badge: 'วางแผน', cover: '#2F5BB7', people: mk('AN'), meta: '2 คน · ยังไม่มีค่าใช้จ่าย', balance: '', balColor: '#5B6B78' }
      ],
      past: [
        { name: 'เขาใหญ่สุดสัปดาห์', dest: 'นครราชสีมา · ไทย', dates: 'มิ.ย. 2569', badge: 'ค้างชำระ', cover: '#B2540F', people: mk('AMK'), meta: '3 คน · ฿7,860', balance: '−฿320', balColor: '#B23A2E' },
        { name: 'เกาะล้าน', dest: 'ชลบุรี · ไทย', dates: 'ส.ค. 2569', badge: 'เคลียร์ครบแล้ว', cover: '#8A3FA0', people: mk('ABP'), meta: '3 คน · ฿4,200', balance: '฿0', balColor: '#5B6B78' }
      ]
    };
    var tabs = [['up', 'กำลังจะไป'], ['past', 'ผ่านมาแล้ว']].map(function (t) {
      var on = st.tab === t[0];
      return { label: t[1], on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#13222F' : '#4A5965', shadow: on ? '0 1px 3px rgba(19, 34, 47, 0.12)' : 'none', pick: function () { self.setState({ tab: t[0] }); } };
    });
    return { tabs: tabs, trips: data[st.tab] };
  }
}
</script>
</body>
</html>
