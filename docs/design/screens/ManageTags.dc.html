<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>จัดการ tag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A6A}a:hover{color:#075E52}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F5F7; color: #13222F; font-family: 'IBM Plex Sans Thai', sans-serif; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px">
    <a href="Places.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #13222F">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">จัดการ tag</h1>
      <span style="font-size: 12px; color: #5B6B78">tag ของคุณใช้ได้กับทุกทริป</span>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 16px">

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #3C4C59">{{g.title}} <span style="font-weight: 400; color: #5B6B78">· {{g.count}}</span></h2>
          <button type="button" aria-label="ตัวเลือกกลุ่ม {{g.title}}" style="width: 40px; height: 40px; border: 0; background: none; color: #5B6B78; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>
        <div style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 18px; overflow: hidden">
          <sc-for list="{{g.tags}}" as="t" hint-placeholder-count="3">
            <button type="button" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border: 0; border-bottom: 1px solid #EEF1F4; background: {{t.bg}}; color: #13222F; text-align: left; cursor: pointer">
              <span style="width: 10px; height: 10px; border-radius: 50%; background: {{t.color}}"></span>
              <span style="flex: 1; font-size: 15px; font-weight: 500">#{{t.name}}</span>
              <span style="font-size: 13px; color: #5B6B78">{{t.count}} ที่</span>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1.5px dashed #C9D3DA; border-radius: 16px; background: none; color: #13222F; font-size: 14px; font-weight: 500; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>สร้างกลุ่มใหม่
    </button>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #3C4C59">ย่านในทริปนี้ <span style="font-weight: 400; color: #5B6B78">· ที่คุณสร้างไว้</span></h2>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #FFFFFF; border-radius: 18px">
        <sc-for list="{{areas}}" as="a" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600">{{a.city}}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{a.items}}" as="x" hint-placeholder-count="3">
                <span style="padding: 4px 10px; border-radius: 999px; background: #F3F5F7; font-size: 13px">{{x}}</span>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <p style="margin: 0; font-size: 12px; color: #5B6B78; line-height: 1.5">แตะชื่อย่านเพื่อเปลี่ยนชื่อ หรือรวมย่านที่พิมพ์ซ้ำกัน เช่น "shinjuku" กับ "Shinjuku"</p>
      </div>
    </section>
  </main>

  <sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(19, 34, 47, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
      <section role="dialog" aria-labelledby="tagSheet" style="display: flex; flex-direction: column; gap: 12px; padding: 22px 20px 32px; background: #FFFFFF; border-radius: 24px 24px 0 0">
        <h2 id="tagSheet" style="margin: 0; font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">#{{selName}}</h2>
        <span style="font-size: 13px; font-weight: 600">ย้ายไปกลุ่ม</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{moveOpts}}" as="m" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1.5px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
          <button type="button" style="min-height: 48px; border: 1px solid #D5DDE3; border-radius: 14px; background: #FFFFFF; color: #13222F; font-size: 14px; font-weight: 600; cursor: pointer">เปลี่ยนชื่อ</button>
          <button type="button" style="min-height: 48px; border: 1px solid #F1C7C2; border-radius: 14px; background: #FFFFFF; color: #B23A2E; font-size: 14px; font-weight: 600; cursor: pointer">ลบ tag</button>
        </div>
        <button type="button" onClick="{{close}}" style="min-height: 48px; border: 0; border-radius: 14px; background: #13222F; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">เสร็จ</button>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sel: '',
      group: { 'ราเมง': 'food', 'ปิ้งย่าง': 'food', 'ชาบู': 'food', 'คาเฟ่': 'food', 'เทมปุระ': 'food', 'ต้องจอง': 'none', 'เปิดดึก': 'none', 'ของฝาก': 'none', 'ไหว้พระ': 'none', 'วิว': 'none' }
    };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var counts = { 'ราเมง': 1, 'ปิ้งย่าง': 1, 'ชาบู': 1, 'คาเฟ่': 1, 'เทมปุระ': 1, 'ต้องจอง': 2, 'เปิดดึก': 1, 'ของฝาก': 1, 'ไหว้พระ': 1, 'วิว': 1 };
    var colors = { food: '#B2540F', none: '#A7B4BE' };
    var defs = [['food', 'อาหาร'], ['none', 'ไม่มีกลุ่ม']];
    var groups = defs.map(function (g) {
      var names = Object.keys(st.group).filter(function (t) { return st.group[t] === g[0]; });
      return {
        title: g[1], count: names.length,
        tags: names.map(function (t) {
          return { name: t, count: counts[t], color: colors[g[0]], bg: st.sel === t ? '#E3F2EF' : '#FFFFFF', pick: function () { self.setState({ sel: t }); } };
        })
      };
    }).filter(function (g) { return g.count > 0; });
    var moveOpts = defs.map(function (g) {
      var on = st.sel && st.group[st.sel] === g[0];
      return {
        label: g[1], on: on ? 'true' : 'false', border: on ? '#0B7A6A' : '#D5DDE3', bg: on ? '#E3F2EF' : '#FFFFFF', fg: on ? '#0B5C50' : '#13222F',
        pick: function () { var x = Object.assign({}, st.group); x[st.sel] = g[0]; self.setState({ group: x }); }
      };
    });
    var areas = [
      { city: 'Tokyo', items: ['Shinjuku · 4', 'Asakusa · 3', 'Akihabara · 2', 'Shibuya · 1', 'Tokyo Station · 1', 'ไม่ระบุย่าน · 1'] }
    ];
    return {
      groups: groups, areas: areas, moveOpts: moveOpts, hasSel: !!st.sel, selName: st.sel,
      close: function () { self.setState({ sel: '' }); }
    };
  }
}
</script>
</body>
</html>
