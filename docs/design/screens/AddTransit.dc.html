<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เพิ่มการเดินทาง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A6A}a:hover{color:#075E52}
button,input{font-family:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #0B7A6A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #13222F; font-family: 'IBM Plex Sans Thai', sans-serif; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 12px">
    <div style="display: flex; align-items: center; gap: 8px; margin-left: -8px">
      <a href="Planner.dc.html" aria-label="ปิด" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #13222F">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
      <h1 style="margin: 0; font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">เพิ่มการเดินทาง</h1>
    </div>
    <nav aria-label="ประเภทรายการ" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F3F5F7; border-radius: 14px">
      <a href="PickPlace.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 10px; color: #4A5965; font-size: 14px; font-weight: 600; text-decoration: none">สถานที่</a>
      <a href="AddTransit.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 10px; background: #FFFFFF; color: #13222F; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: 0 1px 3px rgba(19, 34, 47, 0.12)">การเดินทาง</a>
      <button type="button" style="min-height: 40px; border: 0; border-radius: 10px; background: none; color: #4A5965; font-size: 14px; font-weight: 600; cursor: pointer">โน้ต</button>
    </nav>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 20px">
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5B6B78">สำหรับการเดินทางที่จองไว้ เช่น เที่ยวบิน ชินคันเซ็น รถทัวร์ รับรถเช่า ส่วนการเดินทางสั้นๆ ระหว่างสถานที่ ให้กดช่องระหว่างรายการในหน้าแผน</p>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">ประเภท</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1.5px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <section style="display: flex; flex-direction: column; gap: 0; border: 1px solid #D5DDE3; border-radius: 16px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-bottom: 1px solid #E3E8EC">
        <label for="tfrom" style="font-size: 12px; font-weight: 600; color: #5B6B78">ต้นทาง</label>
        <input id="tfrom" type="text" value="สนามบินฮาเนดะ (HND)" style="height: 32px; padding: 0; border: 0; outline: none; background: none; font-size: 16px; font-weight: 600; color: #13222F">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <label for="tdd" style="font-size: 12px; color: #5B6B78">วันที่ออก</label>
            <input id="tdd" type="date" value="2026-12-15" style="height: 40px; padding: 0 8px; border: 1px solid #E3E8EC; border-radius: 10px; font-size: 14px; color: #13222F; background: #FFFFFF; min-width: 0">
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <label for="tdt" style="font-size: 12px; color: #5B6B78">เวลาออก</label>
            <input id="tdt" type="time" value="18:00" style="height: 40px; padding: 0 8px; border: 1px solid #E3E8EC; border-radius: 10px; font-size: 14px; color: #13222F; background: #FFFFFF; min-width: 0">
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px">
        <label for="tto" style="font-size: 12px; font-weight: 600; color: #5B6B78">ปลายทาง</label>
        <input id="tto" type="text" value="สุวรรณภูมิ (BKK)" style="height: 32px; padding: 0; border: 0; outline: none; background: none; font-size: 16px; font-weight: 600; color: #13222F">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <label for="tad" style="font-size: 12px; color: #5B6B78">วันที่ถึง</label>
            <input id="tad" type="date" value="2026-12-15" style="height: 40px; padding: 0 8px; border: 1px solid #E3E8EC; border-radius: 10px; font-size: 14px; color: #13222F; background: #FFFFFF; min-width: 0">
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <label for="tat" style="font-size: 12px; color: #5B6B78">เวลาถึง</label>
            <input id="tat" type="time" value="23:30" style="height: 40px; padding: 0 8px; border: 1px solid #E3E8EC; border-radius: 10px; font-size: 14px; color: #13222F; background: #FFFFFF; min-width: 0">
          </div>
        </div>
      </div>
    </section>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: -10px">
      <span style="font-size: 12px; color: #5B6B78; align-self: center">เลือกจากลิสต์:</span>
      <button type="button" style="min-height: 32px; padding: 0 10px; border: 1px solid #D5DDE3; border-radius: 999px; background: #FFFFFF; color: #13222F; font-size: 12px; cursor: pointer">สนามบินฮาเนดะ</button>
      <button type="button" style="min-height: 32px; padding: 0 10px; border: 1px solid #D5DDE3; border-radius: 999px; background: #FFFFFF; color: #13222F; font-size: 12px; cursor: pointer">โรงแรมใกล้สถานีชินจูกุ</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="tref" style="font-size: 14px; font-weight: 600">เลขที่จอง / เที่ยวบิน (ไม่บังคับ)</label>
      <input id="tref" type="text" placeholder="เช่น เลขเที่ยวบิน หรือรหัสการจอง" style="height: 48px; padding: 0 14px; border: 1px solid #D5DDE3; border-radius: 14px; font-size: 15px; color: #13222F; background: #FFFFFF">
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">แนบเอกสารจากทริป</legend>
      <sc-for list="{{docs}}" as="d" hint-placeholder-count="3">
        <button type="button" role="checkbox" aria-checked="{{d.on}}" onClick="{{d.toggle}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 14px; text-align: left; cursor: pointer; border: 1.5px solid {{d.border}}; background: {{d.bg}}; color: #13222F">
          <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px; display: flex; align-items: center; justify-content: center; border: 2px solid {{d.boxBorder}}; background: {{d.boxBg}}; color: #FFFFFF">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          </span>
          <span style="width: 32px; height: 36px; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #FCE8E6; color: #B23A2E; font-family: Prompt, sans-serif; font-size: 10px; font-weight: 700">PDF</span>
          <span style="flex: 1; font-size: 14px; font-weight: 600">{{d.name}}</span>
        </button>
      </sc-for>
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: 1.5px dashed #C9D3DA; border-radius: 14px; background: none; color: #13222F; font-size: 14px; font-weight: 500; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>อัปโหลดเอกสารใหม่
      </button>
    </fieldset>

    <section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #F3F5F7">
      <button type="button" role="switch" aria-checked="{{costOn}}" onClick="{{toggleCost}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; padding: 0; border: 0; background: none; color: #13222F; text-align: left; cursor: pointer">
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 600">บันทึกเป็นค่าใช้จ่ายด้วย</span>
          <span style="font-size: 12px; color: #5B6B78">หมวด "เดินทาง" · ไปหน้าหารเงินต่อหลังบันทึก</span>
        </span>
        <span style="width: 44px; height: 26px; flex-shrink: 0; border-radius: 999px; padding: 3px; box-sizing: border-box; display: flex; justify-content: {{swJustify}}; background: {{swBg}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(19, 34, 47, 0.25)"></span></span>
      </button>
      <sc-if value="{{isCost}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border: 1px solid #D5DDE3; border-radius: 14px; background: #FFFFFF">
          <span style="font-family: Prompt, sans-serif; font-weight: 600; color: #5B6B78">฿</span>
          <label for="tcost" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ค่าโดยสารรวม</label>
          <input id="tcost" type="text" inputmode="numeric" placeholder="ค่าโดยสารรวม" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 15px; color: #13222F">
        </div>
      </sc-if>
    </section>
  </main>

  <footer style="padding: 12px 20px 28px; border-top: 1px solid #E3E8EC; background: #FFFFFF">
    <a href="{{saveHref}}" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #0B7A6A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">{{saveLabel}}</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'plane', docs: { flight: true }, cost: false };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var modeDefs = [['plane', 'เครื่องบิน'], ['train', 'รถไฟ/ชินคันเซ็น'], ['bus', 'รถทัวร์'], ['car', 'รถเช่า'], ['boat', 'เรือ'], ['other', 'อื่นๆ']];
    var modes = modeDefs.map(function (m) {
      var on = st.mode === m[0];
      return { label: m[1], on: on ? 'true' : 'false', border: on ? '#13222F' : '#D5DDE3', bg: on ? '#13222F' : '#FFFFFF', fg: on ? '#FFFFFF' : '#13222F', pick: function () { self.setState({ mode: m[0] }); } };
    });
    var docDefs = [['flight', 'ตั๋วเครื่องบิน ไป-กลับ'], ['hotel', 'ใบจองโรงแรม ชินจูกุ'], ['ins', 'ประกันเดินทาง']];
    var docs = docDefs.map(function (d) {
      var on = !!st.docs[d[0]];
      return {
        name: d[1], on: on ? 'true' : 'false',
        border: on ? '#0B7A6A' : '#E3E8EC', bg: on ? '#E3F2EF' : '#FFFFFF',
        boxBorder: on ? '#0B7A6A' : '#A7B4BE', boxBg: on ? '#0B7A6A' : '#FFFFFF',
        toggle: function () { var x = Object.assign({}, st.docs); x[d[0]] = !x[d[0]]; self.setState({ docs: x }); }
      };
    });
    return {
      modes: modes, docs: docs,
      costOn: st.cost ? 'true' : 'false', isCost: st.cost,
      swBg: st.cost ? '#0B7A6A' : '#C9D3DA', swJustify: st.cost ? 'flex-end' : 'flex-start',
      toggleCost: function () { self.setState({ cost: !st.cost }); },
      saveHref: st.cost ? 'AddExpense.dc.html' : 'Planner.dc.html',
      saveLabel: st.cost ? 'บันทึก แล้วไปหารค่าเดินทาง' : 'บันทึกลงแผน'
    };
  }
}
</script>
</body>
</html>
