<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เข้าร่วมทริป</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A6A}a:hover{color:#075E52}
button,input{font-family:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #0B7A6A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #13222F; font-family: 'IBM Plex Sans Thai', sans-serif; overflow: hidden">

  <main style="flex: 1; overflow-y: auto; padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #F3F5F7">
      <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #0B7A6A; color: #FFFFFF; font-family: Prompt, sans-serif; font-size: 13px; font-weight: 600">A</span>
      <span style="font-size: 14px"><strong style="font-weight: 600">Act</strong> ชวนคุณเข้าร่วมทริป</span>
    </div>

    <section style="display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 24px; background: #13222F; color: #FFFFFF">
      <span style="font-size: 13px; color: #B9C6D0">โตเกียว · ญี่ปุ่น</span>
      <h1 style="margin: 0; font-family: Prompt, sans-serif; font-size: 26px; font-weight: 600; line-height: 1.25">โตเกียวหน้าหนาว</h1>
      <span style="font-size: 14px; color: #DCE4EA">ส. 12 – อ. 15 ธ.ค. 2569 · 4 วัน 3 คืน</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid #2C3D4B; padding-top: 12px">
        <div style="display: flex; flex-direction: column"><span style="font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">4</span><span style="font-size: 12px; color: #B9C6D0">สมาชิก</span></div>
        <div style="display: flex; flex-direction: column"><span style="font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">12</span><span style="font-size: 12px; color: #B9C6D0">สถานที่</span></div>
        <div style="display: flex; flex-direction: column"><span style="font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">5</span><span style="font-size: 12px; color: #B9C6D0">ค่าใช้จ่าย</span></div>
      </div>
    </section>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 4px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">คุณคือใครในทริปนี้?</span>
        <span style="font-size: 13px; color: #5B6B78; line-height: 1.5">เลือกชื่อที่เพื่อนเพิ่มไว้ ค่าใช้จ่ายที่บันทึกในชื่อนั้นจะย้ายมาอยู่ในบัญชีคุณ</span>
      </legend>
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{o.on}}" aria-disabled="{{o.taken}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-radius: 16px; text-align: left; cursor: pointer; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: #13222F; opacity: {{o.opacity}}">
          <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 2px solid {{o.dotBorder}}; display: flex; align-items: center; justify-content: center">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: {{o.dot}}"></span>
          </span>
          <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{o.color}}; color: #FFFFFF; font-family: Prompt, sans-serif; font-weight: 600; font-size: 14px">{{o.i}}</span>
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 600">{{o.name}}</span>
            <span style="font-size: 12px; color: #5B6B78">{{o.sub}}</span>
          </span>
        </button>
      </sc-for>
      <button type="button" role="radio" aria-checked="{{newOn}}" onClick="{{pickNew}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 16px; text-align: left; cursor: pointer; border: 1.5px dashed {{newBorder}}; background: {{newBg}}; color: #13222F">
        <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 2px solid {{newDotBorder}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{newDot}}"></span></span>
        <span style="font-size: 15px; font-weight: 500">ไม่มีชื่อฉัน เพิ่มเป็นสมาชิกใหม่</span>
      </button>
      <sc-if value="{{isNew}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="jname" style="font-size: 14px; font-weight: 600">ชื่อที่ให้เพื่อนเห็น</label>
          <input id="jname" type="text" placeholder="เช่น Ploy" style="height: 48px; padding: 0 14px; border: 1px solid #D5DDE3; border-radius: 14px; font-size: 15px; color: #13222F; background: #FFFFFF">
        </div>
      </sc-if>
    </fieldset>
  </main>

  <footer style="display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 28px; border-top: 1px solid #E3E8EC; background: #FFFFFF">
    <a href="Login.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #0B7A6A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
    <a href="Trips.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; font-weight: 600; text-decoration: none">ไว้ก่อน</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'ploy' };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var people = [
      { id: 'act', name: 'Act', i: 'A', color: '#0B7A6A', taken: true, sub: 'เข้าร่วมแล้ว · ผู้จัดทริป' },
      { id: 'mint', name: 'Mint', i: 'M', color: '#2F5BB7', taken: true, sub: 'เข้าร่วมแล้ว' },
      { id: 'beam', name: 'Beam', i: 'B', color: '#B2540F', taken: false, sub: 'ยังไม่มีเจ้าของ · 4 รายการ ส่วนที่ต้องจ่าย ฿6,850' },
      { id: 'ploy', name: 'Ploy', i: 'P', color: '#8A3FA0', taken: false, sub: 'ยังไม่มีเจ้าของ · 5 รายการ ส่วนที่ต้องจ่าย ฿7,950' }
    ];
    var opts = people.map(function (p) {
      var on = st.pick === p.id;
      return {
        name: p.name, i: p.i, color: p.color, sub: p.sub,
        on: on ? 'true' : 'false', taken: p.taken ? 'true' : 'false', opacity: p.taken ? '0.55' : '1',
        border: on ? '#0B7A6A' : '#E3E8EC', bg: on ? '#E3F2EF' : '#FFFFFF',
        dotBorder: on ? '#0B7A6A' : '#A7B4BE', dot: on ? '#0B7A6A' : 'transparent',
        pick: function () { if (!p.taken) self.setState({ pick: p.id }); }
      };
    });
    var isNew = st.pick === 'new';
    var chosen = people.filter(function (p) { return p.id === st.pick; })[0];
    return {
      opts: opts, isNew: isNew, newOn: isNew ? 'true' : 'false',
      newBorder: isNew ? '#0B7A6A' : '#C9D3DA', newBg: isNew ? '#E3F2EF' : '#FFFFFF',
      newDotBorder: isNew ? '#0B7A6A' : '#A7B4BE', newDot: isNew ? '#0B7A6A' : 'transparent',
      pickNew: function () { self.setState({ pick: 'new' }); },
      cta: chosen ? 'เข้าร่วมในชื่อ ' + chosen.name : 'เข้าร่วมทริป'
    };
  }
}
</script>
</body>
</html>
