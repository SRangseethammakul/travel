<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เพิ่มกิจกรรมจากสถานที่ที่มีอยู่</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A6A}a:hover{color:#075E52}
button,input{font-family:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #0B7A6A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #13222F; font-family: 'IBM Plex Sans Thai', sans-serif; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 12px">
    <div style="display: flex; align-items: center; gap: 8px; margin-left: -8px">
      <a href="Planner.dc.html" aria-label="ปิด" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #13222F">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
      <div style="display: flex; flex-direction: column">
        <h1 style="margin: 0; font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">เพิ่มกิจกรรม · วันที่ 2</h1>
        <span style="font-size: 13px; color: #5B6B78">เลือกจากสถานที่ในลิสต์ของทริป</span>
      </div>
    </div>
    <nav aria-label="ประเภทรายการ" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F3F5F7; border-radius: 14px">
      <a href="PickPlace.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 10px; background: #FFFFFF; color: #13222F; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: 0 1px 3px rgba(19, 34, 47, 0.12)">สถานที่</a>
      <a href="AddTransit.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 10px; color: #4A5965; font-size: 14px; font-weight: 600; text-decoration: none">การเดินทาง</a>
      <button type="button" style="min-height: 40px; border: 0; border-radius: 10px; background: none; color: #4A5965; font-size: 14px; font-weight: 600; cursor: pointer">โน้ต</button>
    </nav>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: #F3F5F7; border-radius: 14px; color: #5B6B78">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ค้นหาสถานที่ในทริป</span>
      <input type="search" placeholder="ค้นหาชื่อ ย่าน หรือ tag" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 15px; color: #13222F">
    </label>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 style="margin: 0; font-size: 14px; font-weight: 600">{{sec.title}}</h2>
          <span style="font-size: 12px; color: #5B6B78">{{sec.sub}}</span>
        </div>
        <div role="radiogroup" aria-label="{{sec.title}}" style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{sec.items}}" as="p" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; text-align: left; cursor: pointer; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: #13222F">
              <span style="width: 6px; align-self: stretch; flex-shrink: 0; border-radius: 999px; background: {{p.typeColor}}"></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
                <span style="font-size: 12px; color: #3C4C59">{{p.meta}}</span>
                <span style="font-size: 12px; color: {{p.usedColor}}">{{p.used}}</span>
              </span>
              <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 2px solid {{p.dotBorder}}; display: flex; align-items: center; justify-content: center">
                <span style="width: 10px; height: 10px; border-radius: 50%; background: {{p.dot}}"></span>
              </span>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-for>
    <a href="AddPlace.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1.5px dashed #C9D3DA; border-radius: 16px; color: #13222F; font-size: 14px; font-weight: 500; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>ไม่มีในลิสต์? สร้างสถานที่ใหม่
    </a>
  </main>

  <footer style="display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 28px; border-top: 1px solid #E3E8EC; background: #FFFFFF; box-shadow: 0 -6px 16px rgba(19, 34, 47, 0.06)">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 12px; color: #5B6B78">ที่เลือก</span>
        <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{selName}}</span>
      </span>
      <label for="ptime" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">เวลา</label>
      <input id="ptime" type="time" value="{{time}}" onChange="{{onTime}}" style="width: 120px; height: 44px; padding: 0 10px; border: 1px solid #D5DDE3; border-radius: 12px; font-size: 15px; color: #13222F; background: #FFFFFF">
    </div>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600">เพิ่มลงวันไหนบ้าง (เลือกได้หลายวัน)</legend>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="4">
          <button type="button" role="checkbox" aria-checked="{{d.on}}" onClick="{{d.toggle}}" style="display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 48px; border-radius: 12px; cursor: pointer; border: 1.5px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}">
            <span style="font-size: 11px; opacity: 0.85">{{d.sub}}</span>
            <span style="font-size: 13px; font-weight: 600">{{d.label}}</span>
          </button>
        </sc-for>
      </div>
    </fieldset>
    <a href="Planner.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: {{ctaBg}}; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'cafe', time: '15:00', days: { 2: true } };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var FOCUS = 2;
    var TYPE = { stay: ['ที่พัก', '#3C4C59'], see: ['ที่เที่ยว', '#0B7A6A'], eat: ['ที่กิน', '#B2540F'], fun: ['น่าสนใจ', '#2F5BB7'], move: ['เดินทาง', '#8A3FA0'] };
    var lib = [
      { id: 'hotel', type: 'stay', area: 'Shinjuku', name: 'โรงแรมใกล้สถานีชินจูกุ', tags: [], days: [1, 4] },
      { id: 'ramen', type: 'eat', area: 'Shinjuku', name: 'ร้านราเมงซุปเข้มข้น', tags: ['ราเมง', 'เปิดดึก'], days: [1] },
      { id: 'yakiniku', type: 'eat', area: 'Shinjuku', name: 'ยากินิคุหลังสถานี', tags: ['ปิ้งย่าง', 'ต้องจอง'], days: [3] },
      { id: 'omoide', type: 'fun', area: 'Shinjuku', name: 'Omoide Yokocho', tags: [], days: [] },
      { id: 'sensoji', type: 'see', area: 'Asakusa', name: 'วัดเซ็นโซจิ', tags: ['ไหว้พระ'], days: [2] },
      { id: 'skytree', type: 'see', area: 'Asakusa', name: 'Tokyo Skytree', tags: ['วิว'], days: [2] },
      { id: 'tempura', type: 'eat', area: 'Asakusa', name: 'ร้านเทมปุระเก่าแก่', tags: ['เทมปุระ', 'ต้องจอง'], days: [] },
      { id: 'shabu', type: 'eat', area: 'Akihabara', name: 'ชาบูบุฟเฟ่ต์', tags: ['ชาบู'], days: [2] },
      { id: 'cafe', type: 'eat', area: 'Akihabara', name: 'คาเฟ่ใต้ทางรถไฟ', tags: ['คาเฟ่'], days: [] },
      { id: 'shibuya', type: 'fun', area: 'Shibuya', name: 'Shibuya Crossing', tags: [], days: [3] },
      { id: 'omiyage', type: 'fun', area: 'Tokyo Station', name: 'โซนขนมของฝากในสถานี', tags: ['ของฝาก'], days: [4] },
      { id: 'haneda', type: 'move', area: '', name: 'สนามบินฮาเนดะ', tags: [], days: [1, 4] }
    ];
    var focusAreas = [];
    lib.forEach(function (p) { if (p.days.indexOf(FOCUS) >= 0 && p.area && focusAreas.indexOf(p.area) < 0) focusAreas.push(p.area); });
    var candidates = lib.filter(function (p) { return p.days.indexOf(FOCUS) < 0; });
    var row = function (p) {
      var on = st.sel === p.id;
      var meta = TYPE[p.type][0] + ' · ' + (p.area || 'ไม่ระบุย่าน') + (p.tags.length ? ' · ' + p.tags.map(function (t) { return '#' + t; }).join(' ') : '');
      return {
        name: p.name, meta: meta, typeColor: TYPE[p.type][1],
        used: p.days.length ? 'อยู่ในแผน: ' + p.days.map(function (d) { return 'วัน ' + d; }).join(' · ') : 'ยังไม่จัดวัน',
        usedColor: p.days.length ? '#5B6B78' : '#8A4A0C',
        on: on ? 'true' : 'false', border: on ? '#0B7A6A' : '#E3E8EC', bg: on ? '#E3F2EF' : '#FFFFFF',
        dotBorder: on ? '#0B7A6A' : '#A7B4BE', dot: on ? '#0B7A6A' : 'transparent',
        pick: function () { self.setState({ sel: p.id }); }
      };
    };
    var near = candidates.filter(function (p) { return focusAreas.indexOf(p.area) >= 0; });
    var rest = candidates.filter(function (p) { return focusAreas.indexOf(p.area) < 0; });
    var sections = [
      { title: 'ย่านเดียวกับแผนวันที่ 2', sub: 'วันนี้คุณไป ' + focusAreas.join(' และ ') + ' อยู่แล้ว', items: near.map(row) },
      { title: 'ที่อื่นในลิสต์', sub: 'เรียงตามย่าน', items: rest.sort(function (a, b) { return (a.area || '~').localeCompare(b.area || '~'); }).map(row) }
    ].filter(function (s) { return s.items.length; });
    var chosen = lib.filter(function (p) { return p.id === st.sel; })[0];
    var meta = [[1, 'ส. 12'], [2, 'อา. 13'], [3, 'จ. 14'], [4, 'อ. 15']];
    var days = meta.map(function (m) {
      var on = !!st.days[m[0]];
      return {
        label: 'วัน ' + m[0], sub: m[1], on: on ? 'true' : 'false',
        border: on ? '#0B7A6A' : '#E3E8EC', bg: on ? '#0B7A6A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#13222F',
        toggle: function () { var d = Object.assign({}, st.days); d[m[0]] = !d[m[0]]; self.setState({ days: d }); }
      };
    });
    var n = meta.filter(function (m) { return st.days[m[0]]; }).length;
    var ok = !!chosen && n > 0;
    return {
      sections: sections, days: days, time: st.time,
      onTime: function (e) { self.setState({ time: e.target.value }); },
      selName: chosen ? chosen.name : 'ยังไม่ได้เลือก',
      ctaBg: ok ? '#0B7A6A' : '#A7B4BE',
      cta: ok ? 'เพิ่มลงแผน ' + n + ' วัน' : 'เลือกสถานที่และวัน'
    };
  }
}
</script>
</body>
</html>
