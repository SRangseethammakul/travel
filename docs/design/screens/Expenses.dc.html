<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>รายการค่าใช้จ่าย</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A6A}a:hover{color:#075E52}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F5F7; color: #13222F; font-family: 'IBM Plex Sans Thai', sans-serif; overflow: hidden; position: relative">

  <header style="display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 12px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #5B6B78">โตเกียวหน้าหนาว</span>
      <h1 style="margin: 0; font-family: Prompt, sans-serif; font-size: 24px; font-weight: 600">ค่าใช้จ่าย</h1>
    </div>
    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 18px; background: #13222F; color: #FFFFFF">
        <span style="font-size: 13px; color: #B9C6D0">ยอดรวมทั้งทริป</span>
        <span style="font-family: Prompt, sans-serif; font-size: 22px; font-weight: 600">฿30,350</span>
        <span style="font-size: 12px; color: #B9C6D0">5 รายการ · 4 คน</span>
      </div>
      <a href="Summary.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 18px; background: #E3F2EF; color: #0D2B26; text-decoration: none">
        <span style="font-size: 13px; color: #2D4F49">ส่วนของคุณ ฿7,950</span>
        <span style="font-family: Prompt, sans-serif; font-size: 22px; font-weight: 600; color: #0B7A6A">+฿14,050</span>
        <span style="font-size: 12px; color: #2D4F49; display: flex; align-items: center; gap: 4px">จะได้คืน · ดูสรุป
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </a>
    </section>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 96px; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #5B6B78"><span>{{d.label}}</span><span>{{d.total}}</span></h2>
        <div style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 18px; overflow: hidden">
          <sc-for list="{{d.items}}" as="e" hint-placeholder-count="2">
            <a href="ExpenseDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid #EEF1F4; color: #13222F; text-decoration: none">
              <span style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; background: {{e.tint}}; color: {{e.ink}}; display: flex; align-items: center; justify-content: center; font-family: Prompt, sans-serif; font-size: 13px; font-weight: 600">{{e.abbr}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600">{{e.title}}</span>
                <span style="font-size: 13px; color: #5B6B78">{{e.payer}} จ่าย · หาร {{e.n}} คน</span>
              </span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0">
                <span style="font-family: Prompt, sans-serif; font-size: 16px; font-weight: 600">{{e.amount}}</span>
                <span style="font-size: 12px; color: #5B6B78">คนละ {{e.each}}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>

  <a href="AddExpense.dc.html" style="position: absolute; right: 20px; bottom: 96px; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: 18px; background: #0B7A6A; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: 0 8px 20px rgba(11, 122, 106, 0.28)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>เพิ่มค่าใช้จ่าย
  </a>

  <nav aria-label="เมนูหลัก" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E3E8EC; padding: 6px 4px 22px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5B6B78; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>ทริป</a>
    <a href="Planner.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5B6B78; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>แผน</a>
    <a href="Places.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5B6B78; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>สถานที่</a>
    <a href="Expenses.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #0B7A6A; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>ค่าใช้จ่าย</a>
    <a href="Summary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5B6B78; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>สรุป</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var CAT = {
      stay: { abbr: 'พัก', tint: '#E3F2EF', ink: '#0B7A6A' },
      move: { abbr: 'รถไฟ', tint: '#E6EDFA', ink: '#2F5BB7' },
      food: { abbr: 'กิน', tint: '#FCEBDD', ink: '#B2540F' },
      act: { abbr: 'ตั๋ว', tint: '#F1E6F5', ink: '#8A3FA0' }
    };
    var fmt = function (n) { return '฿' + n.toLocaleString('en-US'); };
    var data = [
      { label: 'ส. 12 ธ.ค. · วันที่ 1', items: [
        { title: 'ที่พัก 3 คืน', cat: 'stay', payer: 'Act', amount: 22000, n: 4 },
        { title: 'Tokyo Subway Ticket 72 ชม.', cat: 'move', payer: 'Beam', amount: 1050, n: 3 },
        { title: 'ร้านราเมงซุปเข้มข้น', cat: 'food', payer: 'Mint', amount: 1200, n: 4 }
      ] },
      { label: 'อา. 13 ธ.ค. · วันที่ 2', items: [
        { title: 'ตั๋ว Tokyo Skytree', cat: 'act', payer: 'Ploy', amount: 2800, n: 4 },
        { title: 'ชาบูบุฟเฟ่ต์', cat: 'food', payer: 'Mint', amount: 3300, n: 3 }
      ] }
    ];
    var days = data.map(function (d) {
      var total = d.items.reduce(function (s, e) { return s + e.amount; }, 0);
      return {
        label: d.label, total: fmt(total),
        items: d.items.map(function (e) {
          var c = CAT[e.cat];
          return { title: e.title, payer: e.payer, n: e.n, amount: fmt(e.amount), each: fmt(Math.round(e.amount / e.n)), abbr: c.abbr, tint: c.tint, ink: c.ink };
        })
      };
    });
    return { days: days };
  }
}
</script>
</body>
</html>
