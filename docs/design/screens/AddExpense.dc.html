<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เพิ่มค่าใช้จ่าย</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Prompt:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A6A}a:hover{color:#075E52}
button,input{font-family:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #0B7A6A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #13222F; font-family: 'IBM Plex Sans Thai', sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px">
    <a href="Expenses.dc.html" aria-label="ปิด" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #13222F">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-family: Prompt, sans-serif; font-size: 18px; font-weight: 600">เพิ่มค่าใช้จ่าย</h1>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 0 8px">
      <label for="amt" style="font-size: 13px; color: #5B6B78">จำนวนเงิน (บาท)</label>
      <div style="display: flex; align-items: baseline; gap: 4px">
        <span style="font-family: Prompt, sans-serif; font-size: 28px; font-weight: 600; color: #5B6B78">฿</span>
        <input id="amt" type="text" inputmode="decimal" value="{{amount}}" onChange="{{onAmount}}" placeholder="0" style="width: 220px; border: 0; outline: none; background: none; font-family: Prompt, sans-serif; font-size: 44px; font-weight: 600; color: #13222F; text-align: center; padding: 0">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="title" style="font-size: 14px; font-weight: 600">รายการ</label>
      <input id="title" type="text" value="ยากินิคุหลังสถานี" style="height: 48px; padding: 0 14px; border: 1px solid #D5DDE3; border-radius: 14px; font-size: 15px; color: #13222F; background: #FFFFFF">
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">หมวดหมู่</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">จ่ายโดย</legend>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{payers}}" as="p" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 16px; cursor: pointer; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: #13222F">
            <span style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{p.color}}; color: #FFFFFF; font-family: Prompt, sans-serif; font-weight: 600; font-size: 14px">{{p.initial}}</span>
            <span style="font-size: 13px; font-weight: 600">{{p.name}}</span>
          </button>
        </sc-for>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">ช่องทางชำระเงิน</legend>
      <div role="radiogroup" aria-label="ช่องทางชำระเงิน" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" role="radio" aria-checked="{{pm.cash.on}}" onClick="{{pm.cash.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border-radius: 14px; cursor: pointer; border: 1.5px solid {{pm.cash.border}}; background: {{pm.cash.bg}}; color: #13222F; font-size: 14px; font-weight: 600; text-align: left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5M18 9.5v5"/></svg>เงินสด
        </button>
        <button type="button" role="radio" aria-checked="{{pm.promptpay.on}}" onClick="{{pm.promptpay.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border-radius: 14px; cursor: pointer; border: 1.5px solid {{pm.promptpay.border}}; background: {{pm.promptpay.bg}}; color: #13222F; font-size: 14px; font-weight: 600; text-align: left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15l-3-3"/><path d="M20 16H5l3 3"/></svg>โอน / พร้อมเพย์
        </button>
        <button type="button" role="radio" aria-checked="{{pm.card.on}}" onClick="{{pm.card.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border-radius: 14px; cursor: pointer; border: 1.5px solid {{pm.card.border}}; background: {{pm.card.bg}}; color: #13222F; font-size: 14px; font-weight: 600; text-align: left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>บัตรเครดิต/เดบิต
        </button>
        <button type="button" role="radio" aria-checked="{{pm.wallet.on}}" onClick="{{pm.wallet.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border-radius: 14px; cursor: pointer; border: 1.5px solid {{pm.wallet.border}}; background: {{pm.wallet.bg}}; color: #13222F; font-size: 14px; font-weight: 600; text-align: left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-4v4"/><circle cx="16" cy="13.5" r="1.3"/></svg>e-Wallet
        </button>
      </div>
      <sc-if value="{{isPromptpay}}" hint-placeholder-val="{{ true }}">
        <button type="button" style="margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1.5px dashed #C9D3DA; border-radius: 14px; background: #F8FAFB; color: #13222F; font-size: 14px; font-weight: 500; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>แนบสลิปการโอน (ไม่บังคับ)
        </button>
      </sc-if>
      <sc-if value="{{isCard}}" hint-placeholder-val="{{ false }}">
        <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px">
          <label for="card4" style="font-size: 13px; color: #5B6B78">เลขท้ายบัตร 4 หลัก (ไม่บังคับ)</label>
          <input id="card4" type="text" inputmode="numeric" maxlength="4" placeholder="••••" style="height: 48px; padding: 0 14px; border: 1px solid #D5DDE3; border-radius: 14px; font-size: 15px; color: #13222F; background: #FFFFFF; letter-spacing: 4px">
        </div>
      </sc-if>
    </fieldset>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-size: 14px; font-weight: 600">หารกับ ({{n}} คน)</h2>
        <button type="button" onClick="{{selectAll}}" style="min-height: 40px; padding: 0 8px; border: 0; background: none; color: #0B7A6A; font-size: 14px; font-weight: 600; cursor: pointer">เลือกทุกคน</button>
      </div>
      <div role="radiogroup" aria-label="วิธีหาร" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F3F5F7; border-radius: 14px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="min-height: 40px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: {{m.bg}}; color: {{m.fg}}; box-shadow: {{m.shadow}}">{{m.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 12px; color: #5B6B78">{{modeHint}}</p>
      <div style="display: flex; flex-direction: column; border: 1px solid #E3E8EC; border-radius: 16px; overflow: hidden">
        <sc-for list="{{split}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 8px; min-height: 60px; padding: 0 12px 0 0; border-bottom: 1px solid #EEF1F4; background: #FFFFFF">
            <button type="button" role="checkbox" aria-checked="{{s.on}}" onClick="{{s.toggle}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 0 0 14px; border: 0; background: none; color: #13222F; text-align: left; cursor: pointer">
              <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px; display: flex; align-items: center; justify-content: center; border: 2px solid {{s.boxBorder}}; background: {{s.boxBg}}; color: #FFFFFF">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
              </span>
              <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{s.color}}; color: #FFFFFF; font-family: Prompt, sans-serif; font-weight: 600; font-size: 13px">{{s.initial}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-size: 15px; font-weight: 500">{{s.name}}</span>
                <sc-if value="{{s.showSub}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 12px; color: #5B6B78">{{s.sub}}</span>
                </sc-if>
              </span>
            </button>
            <sc-if value="{{s.showAmt}}" hint-placeholder-val="{{ true }}">
              <span style="font-family: Prompt, sans-serif; font-size: 15px; font-weight: 600; color: {{s.amtColor}}">{{s.amt}}</span>
            </sc-if>
            <sc-if value="{{s.showInput}}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; align-items: center; gap: 4px; width: 104px; height: 40px; padding: 0 10px; border: 1px solid #D5DDE3; border-radius: 10px">
                <span style="font-size: 14px; color: #5B6B78">฿</span>
                <input type="text" inputmode="decimal" aria-label="ส่วนของ {{s.name}}" value="{{s.custom}}" onChange="{{s.onCustom}}" placeholder="0" style="width: 100%; min-width: 0; border: 0; outline: none; background: none; font-family: Prompt, sans-serif; font-size: 15px; font-weight: 600; color: #13222F; text-align: right">
              </span>
            </sc-if>
            <sc-if value="{{s.showShares}}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; align-items: center; gap: 2px">
                <button type="button" aria-label="ลดส่วนของ {{s.name}}" onClick="{{s.dec}}" style="width: 36px; height: 36px; border: 1px solid #D5DDE3; border-radius: 10px; background: #FFFFFF; color: #13222F; font-size: 18px; cursor: pointer">−</button>
                <span style="width: 28px; text-align: center; font-family: Prompt, sans-serif; font-size: 15px; font-weight: 600">{{s.shares}}</span>
                <button type="button" aria-label="เพิ่มส่วนของ {{s.name}}" onClick="{{s.inc}}" style="width: 36px; height: 36px; border: 1px solid #D5DDE3; border-radius: 10px; background: #FFFFFF; color: #13222F; font-size: 18px; cursor: pointer">+</button>
              </span>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{hasStatus}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 12px; background: {{statusBg}}; color: {{statusFg}}; font-size: 13px; font-weight: 600">
          <span>{{statusText}}</span>
          <sc-if value="{{canSpread}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{spread}}" style="min-height: 32px; padding: 0 10px; border: 1px solid currentColor; border-radius: 8px; background: #FFFFFF; color: inherit; font-size: 12px; font-weight: 600; cursor: pointer">เกลี่ยให้คนที่เหลือ</button>
          </sc-if>
        </div>
      </sc-if>
    </section>
  </main>

  <footer style="padding: 12px 20px 28px; border-top: 1px solid #E3E8EC; background: #FFFFFF">
    <a href="Expenses.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; background: {{saveBg}}; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">บันทึก · {{saveLabel}}</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      amount: '4,800', cat: 'food', payer: 'act', method: 'promptpay',
      sel: { act: true, mint: true, beam: true, ploy: true },
      mode: 'amount',
      custom: { act: '1,200', mint: '900', beam: '1,350', ploy: '1,350' },
      shares: { act: 1, mint: 1, beam: 1, ploy: 1 }
    };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var members = [
      { id: 'act', name: 'Act', initial: 'A', color: '#0B7A6A' },
      { id: 'mint', name: 'Mint', initial: 'M', color: '#2F5BB7' },
      { id: 'beam', name: 'Beam', initial: 'B', color: '#B2540F' },
      { id: 'ploy', name: 'Ploy', initial: 'P', color: '#8A3FA0' }
    ];
    var amount = parseFloat(String(st.amount).replace(/,/g, '')) || 0;
    var chosen = members.filter(function (m) { return st.sel[m.id]; });
    var n = chosen.length;
    var cents = Math.round(amount * 100);
    var baseCents = n ? Math.floor(cents / n) : 0;
    var remCents = n ? cents - baseCents * n : 0;
    var fmt = function (c) {
      var v = c / 100;
      return '฿' + v.toLocaleString('en-US', { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 });
    };
    var catDefs = [['stay', 'ที่พัก'], ['move', 'เดินทาง'], ['food', 'อาหาร'], ['act', 'ตั๋ว/กิจกรรม'], ['other', 'อื่นๆ']];
    var cats = catDefs.map(function (c) {
      var on = st.cat === c[0];
      return { label: c[1], on: on ? 'true' : 'false', border: on ? '#13222F' : '#D5DDE3', bg: on ? '#13222F' : '#FFFFFF', fg: on ? '#FFFFFF' : '#13222F', pick: function () { self.setState({ cat: c[0] }); } };
    });
    var payers = members.map(function (m) {
      var on = st.payer === m.id;
      return { name: m.name, initial: m.initial, color: m.color, on: on ? 'true' : 'false', border: on ? '#0B7A6A' : '#E3E8EC', bg: on ? '#E3F2EF' : '#FFFFFF', pick: function () { self.setState({ payer: m.id }); } };
    });
    var toCents = function (s) { return Math.round((parseFloat(String(s || '').replace(/,/g, '')) || 0) * 100); };
    var mode = st.mode;
    var totalShares = chosen.reduce(function (s, m) { return s + (st.shares[m.id] || 1); }, 0);
    var shareCents = {};
    var used = 0;
    chosen.forEach(function (m) {
      var c = mode === 'shares' ? Math.floor(cents * (st.shares[m.id] || 1) / (totalShares || 1)) : mode === 'amount' ? toCents(st.custom[m.id]) : baseCents;
      shareCents[m.id] = c;
      used += c;
    });
    var diff = cents - used;
    if (mode !== 'amount' && diff > 0) {
      var target = st.sel[st.payer] ? st.payer : (chosen[0] && chosen[0].id);
      if (target) shareCents[target] += diff;
    }
    var split = members.map(function (m) {
      var on = !!st.sel[m.id];
      var c = shareCents[m.id] || 0;
      return {
        name: m.name, initial: m.initial, color: m.color, on: on ? 'true' : 'false',
        boxBorder: on ? '#0B7A6A' : '#A7B4BE', boxBg: on ? '#0B7A6A' : '#FFFFFF',
        showAmt: !on || mode === 'equal', showInput: on && mode === 'amount', showShares: on && mode === 'shares',
        showSub: on && mode === 'shares', sub: fmt(c),
        amt: on ? fmt(c) : 'ไม่ร่วม', amtColor: on ? '#13222F' : '#5B6B78',
        custom: st.custom[m.id] || '', shares: st.shares[m.id] || 1,
        onCustom: function (e) {
          var raw = e.target.value.replace(/[^0-9.]/g, '');
          var x = Object.assign({}, st.custom); x[m.id] = raw ? Number(raw.split('.')[0]).toLocaleString('en-US') + (raw.indexOf('.') >= 0 ? '.' + raw.split('.')[1].slice(0, 2) : '') : '';
          self.setState({ custom: x });
        },
        inc: function () { var x = Object.assign({}, st.shares); x[m.id] = (x[m.id] || 1) + 1; self.setState({ shares: x }); },
        dec: function () { var x = Object.assign({}, st.shares); x[m.id] = Math.max(1, (x[m.id] || 1) - 1); self.setState({ shares: x }); },
        toggle: function () { var s = Object.assign({}, st.sel); s[m.id] = !s[m.id]; self.setState({ sel: s }); }
      };
    });
    var modeDefs = [['equal', 'เท่ากัน', 'ทุกคนจ่ายเท่ากัน เศษสตางค์รวมไว้กับผู้จ่าย'], ['amount', 'ระบุจำนวน', 'ใส่ยอดของแต่ละคนเอง เช่น คนที่ไม่ดื่มจ่ายน้อยกว่า'], ['shares', 'ตามสัดส่วน', 'นับเป็นส่วน เช่น ห้องใหญ่นับ 2 ส่วน ห้องเล็ก 1 ส่วน']];
    var modes = modeDefs.map(function (d) {
      var on = mode === d[0];
      return { label: d[1], on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#13222F' : '#4A5965', shadow: on ? '0 1px 3px rgba(19, 34, 47, 0.12)' : 'none', pick: function () { self.setState({ mode: d[0] }); } };
    });
    var modeHint = modeDefs.filter(function (d) { return d[0] === mode; })[0][2];
    var balanced = mode !== 'amount' || diff === 0;
    var status = { has: false, text: '', bg: '', fg: '', spread: false };
    if (mode === 'amount' && cents > 0) {
      if (diff === 0) status = { has: true, text: 'แบ่งครบ ' + fmt(cents) + ' พอดี', bg: '#E3F2EF', fg: '#0B5C50', spread: false };
      else if (diff > 0) status = { has: true, text: 'ยังเหลือ ' + fmt(diff) + ' ที่ยังไม่ได้แบ่ง', bg: '#FCEBDD', fg: '#8A4A0C', spread: true };
      else status = { has: true, text: 'แบ่งเกินมา ' + fmt(-diff), bg: '#FCE8E6', fg: '#9B2C22', spread: false };
    } else if (mode !== 'amount' && remCents > 0 && mode === 'equal') {
      status = { has: true, text: 'หารไม่ลงตัว เศษ ' + fmt(remCents) + ' รวมไว้กับผู้จ่าย', bg: '#F3F5F7', fg: '#3C4C59', spread: false };
    }
    var spread = function () {
      var empties = chosen.filter(function (m) { return !toCents(st.custom[m.id]); });
      var pool = empties.length ? empties : chosen;
      var each = Math.floor(diff / pool.length);
      var rest = diff - each * pool.length;
      var x = Object.assign({}, st.custom);
      pool.forEach(function (m, i) {
        var c = toCents(st.custom[m.id]) + each + (i === 0 ? rest : 0);
        x[m.id] = (c / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
      });
      self.setState({ custom: x });
    };
    var pm = {};
    ['cash', 'promptpay', 'card', 'wallet'].forEach(function (id) {
      var on = st.method === id;
      pm[id] = { on: on ? 'true' : 'false', border: on ? '#0B7A6A' : '#E3E8EC', bg: on ? '#E3F2EF' : '#FFFFFF', pick: function () { self.setState({ method: id }); } };
    });
    var ok = n > 0 && amount > 0 && balanced;
    return {
      amount: st.amount,
      onAmount: function (e) {
        var raw = e.target.value.replace(/[^0-9.]/g, '');
        var parts = raw.split('.');
        var intPart = parts[0] ? Number(parts[0]).toLocaleString('en-US') : '';
        var v = parts.length > 1 ? intPart + '.' + parts[1].slice(0, 2) : intPart;
        self.setState({ amount: v });
      },
      cats: cats, payers: payers, split: split, n: n,
      pm: pm, isPromptpay: st.method === 'promptpay', isCard: st.method === 'card',
      selectAll: function () { self.setState({ sel: { act: true, mint: true, beam: true, ploy: true } }); },
      modes: modes, modeHint: modeHint,
      hasStatus: status.has, statusText: status.text, statusBg: status.bg, statusFg: status.fg, canSpread: status.spread, spread: spread,
      saveBg: ok ? '#0B7A6A' : '#A7B4BE',
      saveLabel: !(n > 0 && amount > 0) ? 'ใส่จำนวนเงินและคนที่หาร' : !balanced ? 'ยอดที่แบ่งยังไม่ตรง' : mode === 'equal' ? 'คนละ ' + fmt(baseCents) : mode === 'shares' ? 'รวม ' + totalShares + ' ส่วน' : 'แบ่งครบแล้ว'
    };
  }
}
</script>
