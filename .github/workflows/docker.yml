# Build backend + frontend images on Docker Build Cloud and push to Docker Hub.
#   push to main  -> :latest, :main, :sha-<short>
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y
#   pull request  -> build only (cache, no push)
# Repo settings needed:
#   Variables: CLOUD_BUILDER_NAME (the builder at app.docker.com -> Build Cloud, e.g. default)
#   Secrets:   DOCKER_USERNAME, DOCKER_PASSWORD (Docker Hub login)
name: docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  DOCKER_NAMESPACE: suttipongra

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_NAMESPACE }}/travel-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx (Build Cloud)
        uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: ${{ secrets.DOCKER_BUILD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Frontend only: rewrites() bake the backend address in at build time (repo variable BACKEND_URL).
          build-args: |
            BACKEND_URL=${{ vars.BACKEND_URL || 'http://backend:4000' }}
          # PRs only warm the cache; everything else pushes to Docker Hub.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
