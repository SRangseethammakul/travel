# Build backend + frontend images on Docker Build Cloud and push to Docker Hub.
#   push to main  -> :latest, :main, :sha-<short>
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y
#   pull request  -> build only (cache, no push)
# Repo settings needed:
#   Variables: DOCKER_ACCOUNT (e.g. suttipongra), CLOUD_BUILDER_NAME (the builder at app.docker.com -> Build Cloud)
#   Secrets:   DOCKER_ACCESS_TOKEN (Docker Hub personal access token, Read & Write)
name: docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_ACCOUNT }}/travel-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_ACCOUNT }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx (Build Cloud)
        uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: "${{ vars.DOCKER_ACCOUNT }}/${{ vars.CLOUD_BUILDER_NAME }}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PRs only warm the cache; everything else pushes to Docker Hub.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
