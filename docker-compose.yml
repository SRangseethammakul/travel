# Deploy: backend + frontend from the images CI pushes to Docker Hub, on the shared `bangkok` network.
#   docker compose pull && docker compose up -d
#   TRAVEL_BACKEND_TAG=sha-abc1234 docker compose up -d   # pin a version (default: latest)
# .env.travel holds the backend settings (see backend/.env.example): MONGODB_URI, NODE_ENV=production,
# SESSION_SECRET, FILE_URL_SECRET, CORS_ORIGIN, PUBLIC_API_URL, TRUST_PROXY, STORAGE_DRIVER / S3_*, OAuth.
services:
  travel-backend:
    image: suttipongra/travel-backend:${TRAVEL_BACKEND_TAG-latest}
    container_name: travel-backend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - bangkok
    env_file:
      - .env.travel
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  travel-frontend:
    image: suttipongra/travel-frontend:${TRAVEL_FRONTEND_TAG-latest}
    container_name: travel-frontend
    restart: unless-stopped
    depends_on:
      travel-backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - bangkok
    environment:
      BACKEND_URL: http://travel-backend:3000

networks:
  bangkok:
    external: true
